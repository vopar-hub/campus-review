spring:
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: false

    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/admin/users/**
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/admin/restaurants/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/admin/reviews/**

security:
  jwt:
    secret: campus-review-secret-key-for-development-min-length-256bits

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
