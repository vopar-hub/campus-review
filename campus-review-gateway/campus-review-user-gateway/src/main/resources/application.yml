server:
  port: 8001

spring:
  application:
    name: user-gateway
  config:
    import[0]: optional:nacos:user-gateway.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
        import-check:
          enabled: true

