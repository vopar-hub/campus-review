server:
  port: 8105

spring:
  application:
    name: ranking-service
  datasource:
    url: jdbc:mysql://localhost:3306/campus_ranking?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "1234"
  config:
    import: optional:nacos:ranking-service.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        ip: 127.0.0.1
      config:
        server-addr: localhost:8848
        file-extension: yaml
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

downstream:
  restaurant-service-base-url: http://localhost:8102
  interaction-service-base-url: http://localhost:8104
  review-service-base-url: http://localhost:8103

ranking:
  hot-restaurants:
    refresh-ms: 10000
    like-weight: 2.0
    favorite-weight: 3.0
    review-weight: 5.0
    rating-weight: 10.0
    min-review-count: 5
    min-rating: 3.0
    redis-key: ranking:hot-restaurants

# Feign 配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000    # 连接超时 5 秒
        readTimeout: 10000      # 读取超时 10 秒
      # 针对特定服务的配置
      restaurant-service:
        readTimeout: 15000      # 餐馆服务读取超时 15 秒
      review-service:
        readTimeout: 15000      # 评价服务读取超时 15 秒
  # 启用熔断器支持 fallback
  circuitbreaker:
    enabled: false

# Feign 日志级别
logging:
  level:
    com.vapor.ranking.client: DEBUG
    feign: DEBUG
