spring:
  config:
    import:
      - optional:nacos:restaurant-service.yaml?group=DEFAULT_GROUP&refresh=true

  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true

  flyway:
    enabled: true
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:campus-review}
