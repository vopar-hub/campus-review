# user-gateway 生产环境配置

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**, /api/notifications/**
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/restaurants/**, /api/rankings/**, /api/files/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**, /api/interactions/**

security:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
