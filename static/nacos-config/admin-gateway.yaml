# admin-gateway 生产环境配置

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/admin/users/**
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/admin/restaurants/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/admin/reviews/**

security:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
